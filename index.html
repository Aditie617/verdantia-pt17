<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLANTSY </title>

    <link rel="stylesheet" href="style.css" />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">

            <div class="logo">
    <img src="logo.jpeg" alt="Plantsy Logo">
</div>

            <div class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="nav-menu" id="navMenu">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#plants" class="nav-link">Plants</a></li>
            </ul>

        </div>
    </nav>

    <!-- HERO -->
 <div class="vine vine-left">
    <img src="hanging-vines.png" alt="vine">
</div>

<div class="hero-content">

    <h1 class="hero-title">
        PLANTSY
    </h1>

    <p class="hero-subtitle">
        Grow your calm
    </p>

    <button class="cta-button" onclick="scrollToPlants()">
        Explore Plants
    </button>

</div>

<div class="vine vine-right">
    <img src="hanging-vines.png" alt="vine">
</div>

</section>

    

    <!-- FEATURED -->
    <section class="featured">

        <div class="container">

            <h2 class="section-title">
                Featured Plants
            </h2>

            <div class="plants-grid" id="featuredPlants"></div>

        </div>

    </section>

    <!-- ALL PLANTS -->
    <section id="plants" class="plants-page">

        <div class="container">

            <div class="plants-header">

                <h2 class="section-title">
                    All Plants
                </h2>

                <div class="plants-controls">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search plants..."
                        class="search-bar"
                    />

                    <select id="filterSelect" class="filter-select">
                        <option value="all">All Plants</option>
                        <option value="easy">Easy Care</option>
                        <option value="medium">Medium Care</option>
                        <option value="hard">Advanced Care</option>
                    </select>

                </div>

            </div>

            <div class="plants-grid" id="allPlants"></div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 PLANTSY </p>
        </div>
    </footer>
<!-- POPUP MODAL -->

<div class="plant-modal" id="plantModal">

    <div class="modal-content">

        <span class="close-btn" id="closeModal">
            &times;
        </span>

        <img id="modalImage" src="" alt="">

        <h2 id="modalName"></h2>

        <p id="modalScientific"></p>

        <p id="modalCare"></p>

        <span id="modalDifficulty"></span>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
